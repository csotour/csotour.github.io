<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E0E0E0">
<meta name="description" content="Bobby Wang — Software QA & AI Developer. 做工具，也做故事。">
<title>Bobby Wang | Portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FACC15'/%3E%3Crect x='4' y='4' width='56' height='56' fill='none' stroke='%23000' stroke-width='6'/%3E%3Ctext x='32' y='45' font-family='Courier New,monospace' font-size='38' font-weight='900' fill='%23000' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#E0E0E0;--paper:#fff;--ink:#000;
  --green:#4ADE80;--purple:#A78BFA;--yellow:#FACC15;
  --bw:4px;--sh:6px;
  --font:"Courier New",Courier,ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;padding:18px;min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:auto 1fr auto;gap:18px;
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-weight:700;-webkit-font-smoothing:none;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.wrap{width:min(980px,100%);margin-inline:auto}
.skip{position:absolute;top:8px;left:8px;z-index:20;padding:8px 14px;background:#000;color:#fff;transform:translateY(-160%)}
.skip:focus{transform:none}

/* ===== NAV ===== */
.header{position:relative;z-index:6}
.nav{
  display:flex;align-items:stretch;width:max-content;max-width:100%;margin-inline:auto;
  background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 var(--ink);
}
.nav a:not(.brand){
  display:grid;place-items:center;padding:13px 21px;font-size:13px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;border-right:var(--bw) solid var(--ink);
  transition:background .16s,color .16s;
}
.nav a:not(.brand):hover{background:var(--green)}
.nav a.active{background:var(--ink);color:#fff}
.nav a.active:hover{background:var(--ink)}
.brand{
  display:grid;place-items:center;width:58px;flex:none;background:var(--yellow);
  border-right:var(--bw) solid var(--ink);font-size:24px;font-weight:900;
}
.brand:hover{background:var(--purple)}
.locale{position:relative;display:grid}
.lang-btn{
  display:flex;align-items:center;gap:7px;padding:0 15px;cursor:pointer;background:#fff;
  border:0;border-left:var(--bw) solid var(--ink);font-size:12px;font-weight:900;text-transform:uppercase;
}
.lang-btn:hover{background:var(--purple)}
.lang-btn svg{width:15px;height:15px}
.lang-btn .chev{width:11px;height:11px;transition:transform .2s}
.lang-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.locale-panel{
  position:absolute;top:calc(100% + 10px);right:0;z-index:9;width:160px;display:none;
  background:#fff;border:var(--bw) solid #000;box-shadow:var(--sh) var(--sh) 0 #000;
}
.locale-panel.open{display:block;animation:pop .16s steps(3) both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.locale-panel button{
  width:100%;min-height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;border:0;border-bottom:2px solid #000;background:#fff;cursor:pointer;font-size:12px;font-weight:900;
}
.locale-panel button:last-child{border-bottom:0}
.locale-panel button:hover{background:var(--yellow)}
.locale-panel button[aria-pressed="true"]{background:var(--green)}
.locale-panel button svg{width:14px;height:14px;visibility:hidden}
.locale-panel button[aria-pressed="true"] svg{visibility:visible}

/* ===== VIEWS / SHARED ===== */
.view{display:none;grid-area:2/1;min-width:0}
.view.active{display:grid;animation:in .22s steps(4) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 var(--ink);padding:24px;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.tag{display:inline-block;background:#000;color:#fff;padding:4px 10px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.btn{
  position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border:3px solid #000;background:#fff;color:#000;
  font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;overflow:hidden;cursor:pointer;
  transition:transform .1s;
}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--green);transform:translateX(-100%);transition:transform .2s}
.btn:hover::before{transform:none}
.btn:active{transform:scale(.96)}
.btn.alt::before{background:var(--purple)}
.btn svg{width:15px;height:15px;flex:none}
.arrow{width:34px;height:34px;flex:none;display:grid;place-items:center;border:3px solid #000;background:var(--green)}
.arrow svg{width:15px;height:15px}

/* ===== HOME / BENTO ===== */
.home{place-items:center}
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%;max-width:960px;align-content:center}
.profile{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;min-height:430px}
.avatar-wrap{position:relative;width:128px;height:128px;margin-bottom:18px}
.avatar{width:128px;height:128px;border:var(--bw) solid #000;border-radius:50%;object-fit:cover;background:#ddd}
.avatar-fallback{display:none;place-items:center;width:128px;height:128px;border:var(--bw) solid #000;border-radius:50%;background:var(--purple);font-size:52px;font-weight:900}
.name{font-size:clamp(30px,4.6vw,48px);font-weight:900;letter-spacing:-.06em;text-transform:uppercase;line-height:1.05}
.role{background:#000;color:#fff;padding:5px 12px;font-size:13px;font-weight:900;letter-spacing:.06em;transform:rotate(-2deg);margin-top:12px;display:inline-block}
.quote{min-height:3.4em;max-width:92%;margin:22px 0 26px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;font-style:italic;line-height:1.55}
.cursor{color:#7C3AED;font-style:normal}
.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.clock-card{background:var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.clock-time{font-size:clamp(38px,5.5vw,58px);font-weight:900;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}
.clock-date{border-top:3px solid #000;padding-top:8px;width:100%;font-size:12px;font-weight:900;letter-spacing:.08em;text-align:center}
.skills-card .card-title{font-size:15px;font-weight:900;text-transform:uppercase;border-bottom:3px solid #000;padding-bottom:9px;margin-bottom:14px;letter-spacing:.04em}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skill{border:3px solid #000;background:#fff;padding:10px 6px;text-align:center;font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.18s}
.skill svg{width:24px;height:24px;display:block}
.skill:hover{background:#000;color:#fff;box-shadow:4px 4px 0 var(--green);transform:translate(-2px,-2px)}
.now-card{grid-column:1/-1;background:var(--green);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:18px 24px}
.now-card .now-label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;display:inline-block;border:2px solid #000;padding:3px 8px;margin-bottom:8px}
.now-card strong{display:block;font-size:clamp(16px,2.2vw,22px);font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.now-card .now-side{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid #000}
.now-card .now-side:hover{background:var(--yellow)}

/* ===== INNER PAGES ===== */
.page{align-content:start;padding-block:6px 10px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;padding-bottom:18px;border-bottom:4px solid #000;flex-wrap:wrap}
.page-kicker{margin-bottom:8px}
.page-title{font-size:clamp(42px,6.4vw,76px);font-weight:900;letter-spacing:-.07em;line-height:1;text-transform:uppercase}
.page-sub{font-size:12px;font-weight:900;line-height:1.7;letter-spacing:.02em;text-align:right;max-width:36ch}
.page-sub b{background:var(--yellow);padding:1px 5px}

/* works */
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.work{background:#fff;border:var(--bw) solid #000;box-shadow:var(--sh) var(--sh) 0 #000;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.work:hover{transform:translate(-4px,-4px);box-shadow:10px 10px 0 #000}
.cover{position:relative;aspect-ratio:16/9;border-bottom:4px solid #000;background:#F4F4F4;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.fallback::after{content:attr(data-fallback);position:absolute;inset:0;display:grid;place-items:center;background:var(--purple);font-size:54px;font-weight:900}
.cover-tag{position:absolute;top:10px;left:10px;z-index:1}
.work-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.work h2{font-size:clamp(16px,1.8vw,20px);font-weight:900;letter-spacing:-.04em;text-transform:uppercase;line-height:1.25}
.work p{margin-top:7px;font-size:11px;font-weight:700;line-height:1.6;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.work-actions{display:flex;gap:7px;margin-top:auto;padding-top:12px;align-items:center;justify-content:space-between}
.work-actions .btn{padding:8px 10px;font-size:10px;flex:1}
.work-actions .detail{font-size:10px;font-weight:900;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.work-actions .detail:hover{background:var(--yellow)}

/* footer */
.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:34px;border-top:3px dashed #000;padding-top:10px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}

@media(max-width:860px){
  .nav a:not(.brand){padding:12px 14px;font-size:12px}
  .bento{gap:15px}
  .card{padding:18px}
}
@media(max-width:660px){
  body{padding:10px;gap:12px}
  .nav a:not(.brand){padding:10px 8px;font-size:10px;letter-spacing:0}
  .brand{width:42px;font-size:19px}
  .lang-btn{padding:0 9px;font-size:10px}
  .lang-btn .label{display:none}
  .bento{grid-template-columns:1fr;gap:14px}
  .profile,.now-card{grid-column:1/-1;grid-row:auto;min-height:0;padding:24px 16px}
  .clock-card,.skills-card{grid-column:1/-1}
  .works{grid-template-columns:1fr}
  .page-head{align-items:flex-start}
  .page-sub{text-align:left}
  .channels{grid-template-columns:1fr}
  .footer{justify-content:center;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

  // clock
  function updateClock(){
    var n=new Date(),h=String(n.getHours()).padStart(2,"0"),m=String(n.getMinutes()).padStart(2,"0");
    document.getElementById("clock").textContent=h+":"+m;
    document.getElementById("date").textContent=n.toLocaleDateString(lang==="zh"?"zh-CN":"en-US",{month:"short",day:"numeric",weekday:"short"}).toUpperCase();
  }
  setInterval(updateClock,1000);updateClock();

  // typewriter (no external dependency)
  var typeTimer=null,typeTarget=document.getElementById("typedQuote");
  function startTyping(){
    clearTimeout(typeTimer);
    var text=D.quote[lang],i=0,phase="in";
    typeTarget.textContent="";
    function step(){
      if(phase==="in"){
        i++;typeTarget.textContent=text.slice(0,i);
        if(i>=text.length){phase="wait";typeTimer=setTimeout(step,2400);return;}
        typeTimer=setTimeout(step,70);
      }else{
        i--;typeTarget.textContent=text.slice(0,i);
        if(i<=0){phase="in";typeTimer=setTimeout(step,400);return;}
        typeTimer=setTimeout(step,28);
      }
    }
    typeTimer=setTimeout(step,320);
  }

  function renderWorks(){
    var grid=document.getElementById("worksGrid");
    if(!grid)return;
    grid.innerHTML=WORKS.map(function(w){
      var tagKey=w.tag?({"NEW":"tagNew","含惊吓":"tagScary","热门":"tagHot"}[w.tag]||null):null;
      var tag=tagKey?'<span class="tag cover-tag" data-i="'+tagKey+'">'+D[tagKey][lang]+'</span>':'';
      var title=lang==="en"?(w.te||w.t):w.t,desc=lang==="en"?(w.de||w.d):w.d;
      return '<article class="work">'+
        '<div class="cover" data-fallback="'+w.t.charAt(0)+'">'+tag+'<img src="https://miyeji.cn/uploads/covers/thumbs/'+w.img+'" alt="'+title+' '+D.coverAlt[lang]+'" loading="lazy"></div>'+
        '<div class="work-body"><h2>'+title+'</h2><p>'+desc+'</p>'+
        '<div class="work-actions"><a class="btn" href="'+w.url+'" target="_blank" rel="noopener"><span data-i="playBtn">'+D.playBtn[lang]+'</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 18 18 6m-8 0h8v8"/></svg></a>'+
        '<a class="detail" href="https://miyeji.cn/games/'+w.page+'" target="_blank" rel="noopener" data-i="detailBtn">'+D.detailBtn[lang]+'</a></div>'+
        '</div></article>';
    }).join("");
    grid.querySelectorAll(".cover img").forEach(function(img){
      img.addEventListener("error",function(){img.style.display="none";img.parentElement.classList.add("fallback");});
    });
  }
  var av=document.getElementById("avatar");
  av.addEventListener("error",function(){av.style.display="none";document.getElementById("avatarFallback").style.display="grid";});

  applyLang(lang);
  showView(hashName()||"home",false);
})();
</script>
</body>
</html>
